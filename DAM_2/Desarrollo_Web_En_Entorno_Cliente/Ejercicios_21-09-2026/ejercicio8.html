<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let nombreCompleto = prompt("Dime tu nombre y apellidos: ")

    nombreCompleto = nombreCompleto.trim();


    let palabras = nombreCompleto.split(" ");

    let nombre = palabras[0];

    let apellidos = palabras.slice(1).join(" ");

    if (nombre && apellidos) {
        alert(apellidos + ", " + nombre);
    } else {
        alert("Por favor, introduce tanto tu nombre como tus apellidos.");
    }

</script>

<body>

</body>

</html>
