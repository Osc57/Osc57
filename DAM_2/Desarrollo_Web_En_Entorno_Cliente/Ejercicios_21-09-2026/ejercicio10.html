<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let fecha = prompt("Dime la fecha (dd-MM-yyy): ")

    let regex = /^(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[0-2])-\d{4}$/;

    if(regex.test(fecha)){
        alert("Fecha válida")
    }else{
        alert("Fecha no válida")
    }


</script>
