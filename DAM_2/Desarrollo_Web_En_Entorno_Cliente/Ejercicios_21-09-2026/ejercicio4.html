<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    var nombres = ["Julián", "Rodrigo", "Mateo", "Valdemoro"];

    var nombresOrdenados = [...nombres].sort();

    var nombresOrdenadosReversa = [...nombresOrdenados].reverse();

    document.write("Array Principal: " + nombres + "<br>");
    document.write("Nombres Ordenados: " + nombresOrdenados + "<br>");
    document.write("Nombres Ordenados Inverso: " + nombresOrdenadosReversa);
</script>

<body>

</body>

</html>
