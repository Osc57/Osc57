<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let correo = prompt("Dime tu correo electronico: ");

    let regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (regex.test(correo)) {
        alert("Correo válido");

        let posicionAt = correo.indexOf("@");
        
        let nombreUsuario = correo.substring(0, posicionAt);

        let dominio = correo.substring(posicionAt + 1);

        alert("Usuario: " + nombreUsuario + "\nDominio: " + dominio);
        
    } else {
        alert("Correo inválido");
    }

</script>

<body>

</body>

</html>
