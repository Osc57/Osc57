<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    for (let i = 0; i <= 10; i++) {
        document.write("--- Tabla del " + i + " ---" + "<br>");

        for (let j = 0; j <= 10; j++) {
            document.write(i + " * " + j + " = " + (i * j) + "<br>");
        }
    }
</script>
