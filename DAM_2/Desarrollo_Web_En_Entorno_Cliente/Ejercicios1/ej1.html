<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lista de Números Aleatorios</h1>
    <button id="nuevoNumeroBtn">Nuevo número</button>
    <ul id="listaNumeros"></ul>
   
    <script>
         document.getElementById("nuevoNumeroBtn").addEventListener("click", function() {
            const numeroAleatorio = Math.floor(Math.random() * 100) + 1;

            const nuevoElemento = document.createElement("li");
            nuevoElemento.textContent = numeroAleatorio;

            document.getElementById("listaNumeros").appendChild(nuevoElemento);
        });
    </script>
</body>
</html>
